<meta charset="utf-8">
<title>裕信汽車損益管理儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky filter rail on top, tabbed work area below; summary first, drill-down to account detail in a side drawer. */
:root{
  --bg:#f4f5f3; --surface:#fcfcfb; --surface-2:#eef0ec; --ink:#14181a; --ink-2:#4c5452; --muted:#7f8784;
  --line:#dde0da; --line-2:#c6cbc4; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dce9f3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0a7d0a; --good-bg:#e3f2e1; --bad:#c23333; --bad-bg:#f8e4e2; --warn:#a86b00; --warn-bg:#fbefd6;
  --neg-bar:#d06a5f; --pos-bar:#2a78d6;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#1a1d1c; --surface-2:#232726; --ink:#f1f3f1; --ink-2:#bfc6c2; --muted:#8a928e;
  --line:#2c3130; --line-2:#3a403e; --accent:#6aaee0; --accent-ink:#0d1a24; --accent-soft:#1d3346;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9b2f; --s7:#9085e9; --s8:#e66767;
  --good:#4cc24c; --good-bg:#16301a; --bad:#ef7a7a; --bad-bg:#3a1c1c; --warn:#e9b04a; --warn-bg:#3a2d12;
  --neg-bar:#e07b70; --pos-bar:#3987e5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#1a1d1c; --surface-2:#232726; --ink:#f1f3f1; --ink-2:#bfc6c2; --muted:#8a928e;
  --line:#2c3130; --line-2:#3a403e; --accent:#6aaee0; --accent-ink:#0d1a24; --accent-soft:#1d3346;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9b2f; --s7:#9085e9; --s8:#e66767;
  --good:#4cc24c; --good-bg:#16301a; --bad:#ef7a7a; --bad-bg:#3a1c1c; --warn:#e9b04a; --warn-bg:#3a2d12;
  --neg-bar:#e07b70; --pos-bar:#3987e5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
header.top .src{color:var(--muted);font-size:12.5px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.fg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=search]{font:inherit;font-size:12.5px;padding:4px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav.tabs button{border:0;background:transparent;font:inherit;font-size:13.5px;padding:7px 12px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.note{font-size:12px;color:var(--muted)}
section.tab{display:none;padding-top:16px}
section.tab.on{display:block}
h2{font-size:17px;margin:22px 0 10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h3{font-size:14.5px;margin:0 0 8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-size:26px;font-weight:700;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.tile .val small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.tile .cmp{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.neu{background:var(--surface-2);color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--ink-2);font-size:12px;background:var(--surface);position:sticky;top:0}
td.l,th.l{text-align:left}
td.num,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px}
tr.sum td{font-weight:700;background:var(--surface-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;z-index:99;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;max-width:320px;line-height:1.45;display:none}
#tip b{font-family:var(--f-num);font-weight:500}
.diag{display:grid;gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:var(--r);padding:12px 16px;min-width:0}
.dcard.bad{border-left-color:var(--bad)} .dcard.good{border-left-color:var(--good)} .dcard.warn{border-left-color:var(--warn)}
.dcard h4{margin:0 0 6px;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dcard dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
.dcard dt{color:var(--muted);font-size:12px;padding-top:1px}
.dcard dd{margin:0;max-width:80ch}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2);font-weight:400}
.tree td.l{padding-left:calc(8px + var(--d,0) * 16px)}
.tree .tg{display:inline-block;width:14px;color:var(--muted);cursor:pointer;user-select:none}
.tree tr.lv0 td,.tree tr.lv1 td{font-weight:700}
.tree tr.lv1 td{background:var(--surface-2)}
.hl{background:var(--warn-bg)}
.mx td{cursor:pointer}
.mx td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100vw);background:var(--surface);border-left:1px solid var(--line-2);z-index:50;overflow-y:auto;padding:18px 20px 40px;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .x{position:sticky;top:0;float:right;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:3px 10px;cursor:pointer;font:inherit}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.cmt{background:var(--surface-2);border-radius:var(--r);padding:8px 10px;font-size:12.5px;white-space:pre-wrap;margin:6px 0}
.flex{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.muted{color:var(--muted)}
ul.plain{margin:6px 0;padding-left:18px} ul.plain li{margin:3px 0;max-width:90ch}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13px}
.miss{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:6px 10px;margin-top:8px}
</style>


<style>
.lock{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 26px;width:min(380px,100%);display:grid;gap:12px}
.lock h1{font-size:19px;margin:0}
.lock p{margin:0;color:var(--ink-2);font-size:13px}
.lock input{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--ink)}
.lock button{font:inherit;font-size:14px;padding:9px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.lock button:disabled{opacity:.6;cursor:progress}
.lock .err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
<div class="lock" id="lock"><form id="lock-f" autocomplete="off">
  <h1>裕信汽車損益管理儀表板</h1>
  <p>此頁內容已加密，請輸入密碼開啟。</p>
  <label for="lock-pw" class="note">密碼</label>
  <input type="password" id="lock-pw" inputmode="numeric" autofocus required>
  <button type="submit" id="lock-b">開啟儀表板</button>
  <div class="err" id="lock-e" role="alert"></div>
</form></div>
<div id="app"></div>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}

  try{const p=await open(document.getElementById('lock-pw').value);

  }catch(err){e.textContent='密碼不正確，請再試一次。';b.disabled=false;}});
})();
